[package]
name = "aws_app_lib"
version = "0.12.10"
authors = ["Daniel Boline <ddboline@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
aws-config = {version="1.13", features=["behavior-version-latest"]}
aws-types = "1.7"
aws-sdk-ec2 = "1.273"
aws-sdk-ecr = "1.137"
aws-sdk-iam = "1.132"
aws-sdk-pricing = "1.122"
aws-sdk-route53 = "1.131"
aws-sdk-s3 = "1.156"
aws-sdk-ses = "1.122"
aws-sdk-sts = "1.123"
aws-smithy-runtime-api = "1.19"
aws-smithy-types = "1.9"
base64 = "0.23"
bytes = "1.12"
clap = {version="4.6", features=["derive"]}
deadpool = "=0.13"
deadpool-postgres = { version = "0.14", features=["serde"] }
derive_more = {version="2.1", features = ["full"]}
dirs = "7.0"
dotenvy = "0.15"
envy = "0.4"
flate2 = "1.1"
futures = "0.3"
infer = "0.22"
itertools = "0.15"
log = "0.4"
maplit = "1.0"
once_cell = "1.21"
parking_lot = "0.13"
postgres-types = "0.2"
postgres_query = {git = "https://github.com/ddboline/rust-postgres-query", tag = "0.3.9", features=["deadpool"]}
rand = "0.10"
refinery = {version="0.10", features=["tokio-postgres"]}
reqwest = {version="0.13", features=["cookies", "json"]}
roxmltree = "0.21"
select = "0.6"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
smallvec = "1.16"
stack-string = { version="1.1", features=["postgres_types"] }
stdout-channel = "0.6"
sysinfo = "0.40"
tempfile = "3.27"
tempdir = "0.3"
thiserror = "2.0"
time = {version="0.3", features=["serde-human-readable", "macros", "formatting"]}
time-tz = {version="2.0", features=["system"]}
tokio = { version="1.54", features=["rt", "macros", "rt-multi-thread"]}
tokio-postgres = {version = "0.7", features = ["with-time-0_3", "with-uuid-1", "with-serde_json-1"]}
walkdir = "2.5"
url = "2.5"
uuid = { version = "1.29", features = ["serde", "v4"] }
mail-parser = "0.11"
zip = {version = "9.1", default-features = false, features=["aes-crypto", "bzip2", "deflate", "deflate64", "lzma", "time", "zstd"]}

[dev-dependencies]
flate2 = "1.1"
